profile: multica_architecture_rnd_teams_v2
account: allen@qq.com
workspace_slug: unidocs-rag
activation:
  requires_explicit_authorization: true
  import_mode: conflict_fail
  binding_mode: additive
  applies_to: new_attempts_only
contracts:
  human_surface: human_review_surface_v2
  internal_evidence: architecture_internal_evidence_v1
  material_bundle: multica_human_action_material_bundle_v3
  issue_comment:
    visible_prose_budget_code_points: 600
    exclusions: [stable_links, attachment_filenames, action_code_block]
    labels: [需要你确认, Agent处理中无需回复, Agent已完成无需确认]
  material_entries:
    audience: [human, agent]
    review_requirement: [required, reference_only, none]
    labels: [需要阅读并确认, 供人参考无需单独确认, Agent内部材料无需阅读]
    exactly_one_required_per_action: true
  decision_readiness:
    access_states: [opened, manual_check_required, unavailable, not_run]
    readiness_states: [validated, manual_check_required, unreadable, incomplete, not_run]
    recovery_reply: "ACTION <action_id>: 材料不可决策; reason=<原因>"
archify:
  version: "2.17"
  repository_revision: bb71ccdd64cd3a74ba7cbd25bbacc7382da34410
  archive_sha256: ed178d2ddd8861db1b8e867f32be7764bdec221d44568c37b6ae157c5e7f111c
  diagram_types: [architecture, workflow, sequence, dataflow, lifecycle]
teams:
  - name: Architecture Team
    agents:
      - name: Architecture Lead
        archify_binding: none
      - name: Architecture Analyst
        archify_binding: none
      - name: Solution Architect
        archify_binding: author
        instruction: >-
          Create a human-readable action-bound Design or pre-Design detail whose first screen explains
          what must be decided, the recommendation, up to three option tradeoffs, immediate effects and
          one Action. Use Archify when it improves understanding; run validate, deliver and visual-check,
          then bind the current receipt and light/1440x900 preview as human_reference, never a second Action.
      - name: Architecture Reviewer
        archify_binding: review_only
        instruction: >-
          Independently verify frozen diagram evidence and human decision readiness: the architecture view,
          boundaries, flows, labels and option consequences must support a decision. Report findings by stable
          IDs; never modify source or run deliver as the author, and mark unreadable/incomplete fail closed.
  - name: R&D Team
    agents:
      - name: R&D Lead
        archify_binding: none
      - name: Product & Spec Engineer
        archify_binding: conditional_author
        instruction: >-
          Reuse approved architecture diagrams first; create at most one scope-local implementation visual
          only when the authorized OpenSpec needs details not covered upstream. Keep Issue updates compact,
          place detailed implementation guidance in labeled human_reference or agent_internal material,
          and never create an extra human Action for a supporting diagram.
      - name: Solution Review Architect
        archify_binding: review_only
        instruction: >-
          Check proposal, design, specs, tasks and code evidence against the approved Design and frozen visuals;
          verify that human-facing detail remains decision-readable and responsibility labels are correct;
          never edit or redeliver diagram sources.
      - name: Development Engineer
        archify_binding: none
      - name: Code Review Engineer
        archify_binding: none
      - name: QA Engineer
        archify_binding: none
      - name: Integration & Archive Engineer
        archify_binding: none
      - name: Workflow Watchdog
        archify_binding: none
migration:
  legacy_attempts: frozen_read_only
  upgrade: explicit_superseding_attempt
  preserve_comments_attachments_packets_decisions: true
reimport:
  sequence:
    - Resolve the exact existing workspace and Agent identities.
    - Import core, adapter, and Archify with conflict-fail semantics.
    - Verify the imported pair is human_review_surface_v2 plus multica_human_action_material_bundle_v3.
    - Add bindings only to the four named target Agents.
    - Read back every Skill ID, digest, binding profile, and full instruction.
    - Confirm every non-target Agent remains unbound to Archify.
  live_write: not_run
  sandbox_acceptance: not_run
